{% extends "base.html" %}{% block main %}<h1>Change password</h1><p class="sub">Logs out any other open sessions.</p>
<div class="card" style="max-width:420px"><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Current password</label><input type="password" name="old" autocomplete="current-password" required>
<label>New password (8+ characters)</label><input type="password" name="pw" autocomplete="new-password" required>
<label>Repeat new password</label><input type="password" name="pw2" autocomplete="new-password" required>
<p><button>Change password</button></p></form></div>{% endblock %}
